<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tender Intelligence</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 40px 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        .controls { background: white; padding: 18px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
        input, select { padding: 11px; border: 1px solid #ccc; border-radius: 7px; margin-right: 8px; margin-bottom: 8px; }
        input { width: min(360px, 90%); }
        .grid { display: grid; gap: 18px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
        .title { font-size: 21px; font-weight: bold; margin-bottom: 18px; }
        .row { display: flex; justify-content: space-between; gap: 20px; padding: 11px 0; border-bottom: 1px solid #eee; }
        .label { font-weight: bold; color: #555; }
        .value { text-align: right; }
        .section { margin-top: 20px; }
        ul { padding-left: 20px; }
        li { margin: 7px 0; }
        .tag { display: inline-block; background: #eef2f7; padding: 5px 9px; border-radius: 12px; font-size: 12px; margin-bottom: 12px; }
        .warning { margin-top: 18px; padding: 12px; background: #fff3cd; border-radius: 8px; color: #664d03; font-size: 13px; }
        .footer { margin-top: 25px; color: #777; font-size: 13px; }
        .error { padding: 15px; background: #f8d7da; color: #842029; border-radius: 8px; }
        .count { color: #666; margin: 12px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>Tender Intelligence</h1>
    <div class="subtitle">Find and understand government tender opportunities</div>

    <div class="controls">
        <input id="search" type="search" placeholder="Search work, department or location...">
        <select id="category">
            <option value="all">All categories</option>
        </select>
    </div>

    <div id="count" class="count"></div>
    <div id="app" class="grid">Loading tender data...</div>

    <div class="footer">Tender Intelligence V0.3 — Multi-tender prototype</div>
</div>

<script>
let tenders = [];

function formatDate(value) {
    return new Date(value).toLocaleDateString('en-IN', {
        day: 'numeric', month: 'long', year: 'numeric'
    });
}

function render() {
    const query = document.getElementById('search').value.toLowerCase().trim();
    const category = document.getElementById('category').value;
    const app = document.getElementById('app');

    const filtered = tenders.filter(tender => {
        const text = `${tender.work} ${tender.department} ${tender.location}`.toLowerCase();
        const matchesSearch = text.includes(query);
        const matchesCategory = category === 'all' || tender.category === category;
        return matchesSearch && matchesCategory;
    });

    document.getElementById('count').textContent = `${filtered.length} tender(s) found`;

    if (filtered.length === 0) {
        app.innerHTML = '<div class="card">No tenders match your search.</div>';
        return;
    }

    app.innerHTML = filtered.map(tender => `
        <div class="card">
            <div class="tag">${tender.category}</div>
            <div class="title">${tender.work}</div>
            <div class="row"><div class="label">Department</div><div class="value">${tender.department}</div></div>
            <div class="row"><div class="label">Location</div><div class="value">${tender.location}</div></div>
            <div class="row"><div class="label">Tender Value</div><div class="value">₹${Number(tender.value_lakh).toFixed(2)} lakh</div></div>
            <div class="row"><div class="label">Closing Date</div><div class="value">${formatDate(tender.closing_date)}</div></div>
            <div class="row"><div class="label">Eligibility</div><div class="value">${tender.eligibility}</div></div>
            <div class="section">
                <strong>Checks Before Bidding</strong>
                <ul>${tender.checks_before_bidding.map(item => `<li>${item}</li>`).join('')}</ul>
            </div>
            <div class="warning">Prototype data. Verify the official tender document before bidding.</div>
        </div>
    `).join('');
}

async function loadTenders() {
    const app = document.getElementById('app');
    try {
        const response = await fetch('./data/tenders.json');
        if (!response.ok) throw new Error('Could not load tender data');
        const data = await response.json();
        tenders = data.tenders || [];

        const categories = [...new Set(tenders.map(t => t.category).filter(Boolean))].sort();
        const categorySelect = document.getElementById('category');
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            categorySelect.appendChild(option);
        });

        render();
    } catch (error) {
        app.innerHTML = `<div class="error">Unable to load tender data. ${error.message}</div>`;
    }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('category').addEventListener('change', render);
loadTenders();
</script>
</body>
</html>
